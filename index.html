<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LDS Catering | Coming Soon</title>

    <meta name="description"
          content="LDS Catering – Delicious food for beautiful celebrations. Coming soon.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                linear-gradient(
                    rgba(45, 25, 12, 0.72),
                    rgba(45, 25, 12, 0.72)
                ),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .overlay {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .content {
            max-width: 700px;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #e7c477;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .content h1 {
            font-size: clamp(55px, 10vw, 100px);
            line-height: 1;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .content h2 {
            font-family: Arial, sans-serif;
            font-size: clamp(18px, 3vw, 26px);
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f0d79a;
            margin-bottom: 28px;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: #d4af5a;
            margin: 0 auto 28px;
        }

        .content p {
            font-family: Arial, sans-serif;
            font-size: 18px;
            line-height: 1.7;
            color: #f5f5f5;
            margin-bottom: 35px;
        }

        .coming {
            display: inline-block;
            padding: 14px 30px;
            border: 1px solid #d4af5a;
            color: #f0d79a;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .footer {
            position: absolute;
            bottom: 25px;
            width: 100%;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.65);
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {

            .content h1 {
                font-size: 58px;
            }

            .content h2 {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .content p {
                font-size: 15px;
            }

            .logo {
                margin-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="overlay">

        <div class="content">

            <div class="logo">
                LDS Catering
            </div>

            <h1>Coming Soon</h1>

            <div class="divider"></div>

            <h2>Wedding • Marriage • Celebrations</h2>

            <p>
                Delicious food. Beautiful celebrations.<br>
                Something special is being prepared for you.
            </p>

            <div class="coming">
                Website Launching Soon
            </div>

        </div>

        <div class="footer">
            © 2026 LDS Catering · ldscatering.in
        </div>

    </div>

</body>
</html>
